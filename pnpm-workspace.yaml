# Dependency install scripts pnpm may run. cypress downloads its binary; esbuild and
# unrs-resolver set up their platform binaries. @parcel/watcher only builds from source
# when asked to, and browser-tabs-lock only prints a banner.
allowBuilds:
  '@parcel/watcher': false
  browser-tabs-lock: false
  cypress: true
  esbuild: true
  unrs-resolver: true

overrides:
  '@types/react': ^19.3.0
  '@module-federation/vite>@module-federation/dts-plugin': ^2.9.2
  '@vercel/frameworks>js-yaml': ^3.15.2
  '@vercel/frameworks>smol-toml': ^1.9.0
  typeid-js>uuid: ^11.1.1
