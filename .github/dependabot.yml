# Keeps the SHA-pinned actions in .github/workflows up to date.
# Dependabot updates the commit SHA and the trailing "# vX.Y.Z" comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
